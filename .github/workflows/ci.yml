name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name of this job is the status check that the branch ruleset requires
  # (.github/rulesets/main.json). Change both together.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the migrations and the API tests. The credentials
    # match the default in apps/api/vitest.config.e2e.ts; nothing here is a secret.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: slotwise
          POSTGRES_DB: slotwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotwise -d slotwise_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Migrate the test database
        run: pnpm db:migrate:test
        env:
          DATABASE_URL: postgres://slotwise:slotwise@localhost:5432/slotwise_test

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lighthouse (landing page, budget 95)
        run: pnpm lighthouse

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
