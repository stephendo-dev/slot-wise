packages:
  - apps/*
  - packages/*

engineStrict: true

allowBuilds:
  sharp: false
  unrs-resolver: false
  '@nestjs/core': false
  esbuild: false
  argon2: false

# Fixed versions for build-time dependencies of @lhci/cli and @nestjs/cli (see SECURITY.md).
overrides:
  tmp: '>=0.2.6'
  basic-ftp: '>=6.2.1'
  uuid: '>=11.1.1'
  minimatch@<11: '>=11.0.1'
